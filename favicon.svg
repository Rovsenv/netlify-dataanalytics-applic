<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)"/>
  
  <!-- Data Analytics symbol - bar chart with trend line -->
  <!-- Bars -->
  <rect x="14" y="36" width="6" height="14" rx="2" fill="white" opacity="0.9"/>
  <rect x="23" y="28" width="6" height="22" rx="2" fill="white" opacity="0.9"/>
  <rect x="32" y="22" width="6" height="28" rx="2" fill="white" opacity="0.95"/>
  <rect x="41" y="18" width="6" height="32" rx="2" fill="white"/>
  
  <!-- Trend line overlay -->
  <path d="M 12 42 Q 20 34, 29 28 T 50 16" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Data point circles -->
  <circle cx="12" cy="42" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="29" cy="28" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="50" cy="16" r="2.5" fill="#fff" opacity="0.8"/>
</svg>
